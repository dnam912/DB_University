<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
</head>
<body>
    <h1>Sign Up</h1>
    
    {% if error %}
        <p style="color: blue;">{{ error }}</p>
    {% endif %}

    <form action="{{ url_for('signup') }}" method="post">
        <label for="email">University Email:</label><br>
        <input type="email" id="email" name="email" placeholder="id@university.edu" required><br><br>

        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" maxlength="20" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" maxlength="20" required><br><br>

        <button type="submit">Sign Up</button>
    </form>

    <p>Already have an account? <a href="/login">Login</a></p>
    <p><a href="/">Back to Home</a></p>
</body>
</html>
