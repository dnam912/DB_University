<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    
    <h1>Instructor Dashboard</h1>
    <h2>{{ session["name"] }}'s Page</h2>       <!-- {{ name }} -->
    <p>Username: {{ session["username"] }}</p>  <!-- {{ username }}-->
    
    <a href="/logout">Logout</a>
    <h3>Modify Information</h3>

    <form action="{{ url_for('modify_personal_information_data') }}" method="post">
        <label>First Name: </label>
                <input type="text" name ="first_name" value="{{ instructor.first_name }}" required><br>
        <label>Middle Name: </label>
                <input type="text" name ="middle_name" value="{{ instructor.middle_name }}"><br>
        <label>Last Name: </label>
                <input type="text" name ="last_name" value="{{ instructor.last_name }}" required><br>
        <label>Email: </label>
                <input type="email" name ="email" value="{{ instructor.email }}" required><br>
        <button type="submit">Submit</button>
    </form>
    {%if success is defined%}
        <p>Information updated</p>
    {%endif%}

    <form action = "{{ url_for('instructor')}}" method="get">
            <button type="submit">Done</button>
    </form>
</body>
</html>
